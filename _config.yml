# ==========================================================================
#  Site-wide configuration for Siyuan Luo's academic homepage.
#  Based on the AcademicPages template (https://github.com/academicpages).
#  Customization points:
#    - Basic site (title, url, description)
#    - Author block (sidebar content)
#    - Navigation is in _data/navigation.yml
#    - Skin / theme: "site_theme" below. Options: default, air, sunrise, mint, dirt, contrast
# ==========================================================================

# ---- Basic site ----
locale                   : "en-US"
site_theme               : "dirt"           # warm, paper-like palette
title                    : "Siyuan Luo"
title_zh                 : "骆思缘"           # used by the bilingual toggle (custom)
title_separator          : "·"
name                     : &name "Siyuan Luo"
description              : &description "Siyuan Luo - robot learning engineer and University of Melbourne MSE student working on VLA, world-action models, and audio continual learning."
url                      : https://luosyrrrr.github.io
baseurl                  : ""
repository               : "LUOSYrrrr/LUOSYrrrr.github.io"

# ---- Author (sidebar card) ----
author:
  avatar           : "profile.jpg"
  name             : "Siyuan Luo"
  pronouns         :
  bio              : "Robot learning · VLA / WAM · Audio continual learning"
  location         : "Melbourne, Australia"
  employer         : "University of Melbourne"
  uri              :
  email            : "luosylois@gmail.com"

  # Academic
  academia         :
  arxiv            :
  googlescholar    :
  inspire-hep      :
  impactstory      :
  orcid            :
  semantic         :
  ssrn             :
  pubmed           :
  researchgate     :
  scopus           :
  zotero           :

  # Code hosting
  bitbucket        :
  codepen          :
  dribbble         :
  github           : "LUOSYrrrr"
  kaggle           :
  stackoverflow    :

  # Social
  artstation       :
  bluesky          :
  facebook         :
  flickr           :
  foursquare       :
  goodreads        :
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
  linkedin         :
  mastodon         :
  medium           :
  pinterest        :
  soundcloud       :
  steam            :
  telegram         :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  wikipedia        :
  xing             :
  youtube          :
  zhihu            :

# ---- Publication categories (unused for now; left for later) ----
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'
  conferences:
    title: 'Conference Papers'

# ---- Site settings ----
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               :
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"
atom_feed:
  hide                   : false
  path                   :

# ---- SEO ----
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# ---- Social sharing ----
twitter:
  username               : &twitter
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :
og_description           :
social:
  type                   :
  name                   :
  links:

# ---- Analytics ----
analytics:
  provider               :  "false"
  google:
    tracking_id          :

# ---- Reading files ----
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# ---- Markdown processing ----
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# ---- Collections ----
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# ---- Defaults ----
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# ---- Sass ----
sass:
  sass_dir: _sass
  style: compressed

# ---- Output ----
permalink: /:categories/:title/
timezone: Etc/UTC

# ---- Plugins ----
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# ---- Archives ----
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# ---- HTML compression ----
compress_html:
  clippings: all
  ignore:
    envs: development
