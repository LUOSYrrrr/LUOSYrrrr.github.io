{% include base_path %}

{% comment %}
  The <html> lang-* class is applied by the early-init script in
  _includes/head/custom.html. Here we only render the masthead HTML
  and the click-toggle behaviour.

  Reminder: inside <script> we only use /* */ block comments that do
  NOT themselves contain `/*` or `*/`. Jekyll's compress_html removes
  newlines, which turns `//` line comments into script-eating comments.
{% endcomment %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><span class="navicon"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist {% if page.url == '/' or page.url == '/index.html' %}selected{% endif %}">
            <a href="{{ base_path }}/"
               data-en="{{ site.title }}"
               data-zh="{{ site.title_zh | default: site.title }}">{{ site.title }}</a>
          </li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
              <a href="{{ domain }}{{ link.url }}"
                 data-en="{{ link.title }}"
                 data-zh="{{ link.title_zh | default: link.title }}">{{ link.title }}</a>
            </li>
          {% endfor %}
          <li id="lang-toggle" class="masthead__menu-item persist tail">
            <a role="button" title="Switch language / 切换语言"><span id="lang-icon">中</span></a>
          </li>
          <li id="theme-toggle" class="masthead__menu-item persist tail">
            <a role="button" aria-labelledby="theme-icon"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true" title="toggle theme"></i></a>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>

<script>
  (function () {
    var KEY = 'site-lang';
    var root = document.documentElement;

    function setLang(lang) {
      root.classList.remove('lang-en', 'lang-zh');
      root.classList.add('lang-' + lang);
      root.setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en');
      var nodes = document.querySelectorAll('[data-en][data-zh]');
      for (var i = 0; i < nodes.length; i++) {
        var t = nodes[i].getAttribute('data-' + lang);
        if (t !== null) nodes[i].textContent = t;
      }
      var icon = document.getElementById('lang-icon');
      if (icon) icon.textContent = lang === 'zh' ? 'EN' : '中';
    }

    function syncToCurrent() {
      setLang(root.classList.contains('lang-zh') ? 'zh' : 'en');
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', syncToCurrent);
    } else {
      syncToCurrent();
    }

    document.addEventListener('click', function (e) {
      var btn = e.target && e.target.closest ? e.target.closest('#lang-toggle') : null;
      if (!btn) return;
      e.preventDefault();
      var next = root.classList.contains('lang-zh') ? 'en' : 'zh';
      try { localStorage.setItem(KEY, next); } catch (err) {}
      setLang(next);
    });
  })();
</script>
